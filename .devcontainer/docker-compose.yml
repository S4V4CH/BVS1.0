services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    environment:
      # Misma URL que remoteEnv del devcontainer; @db es el servicio Postgres en esta red.
      DATABASE_URL: postgresql://bvsuser:bvspassword@db:5432/ticket_issuer_db?schema=public
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - ..:/workspaces/BSV_1.0:cached
    working_dir: /workspaces/BSV_1.0
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bvsuser
      POSTGRES_PASSWORD: bvspassword
      POSTGRES_DB: ticket_issuer_db
    # 5434 en el host evita choque con otro Postgres que ya use 5433 en Windows
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
