<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVS Ticket Issuer | Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">
                <span class="icon">⚡</span>
                <h1>BVS <span>Ticket Issuer</span></h1>
            </div>
            <p class="subtitle">Microservicio de Emisión de Tickets Blockchain</p>
        </header>

        <main class="dashboard">
            <section class="card-generator glass">
                <h2>Generador de Cargas</h2>
                <div class="input-group">
                    <label for="voteId">Vote ID (UUID V4)</label>
                    <div class="input-with-action">
                        <input type="text" id="voteId" placeholder="Generar UUID..." readonly>
                        <button id="btnGenVoteId" class="btn-action">Auto-gen</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="electionId">Election ID</label>
                    <input type="text" id="electionId" value="ELEC-STUDENT-2024">
                </div>

                <div class="input-group">
                    <label for="voterToken">Voter Token (Anonymous)</label>
                    <div class="input-with-action">
                        <input type="text" id="voterToken" placeholder="Generar Token..." readonly>
                        <button id="btnGenToken" class="btn-action">Auto-gen</button>
                    </div>
                </div>

                <button id="btnEmit" class="btn-primary">EMITIR TICKET</button>
            </section>

            <section class="card-terminal glass">
                <h2>Terminal de Trazabilidad</h2>
                <div id="terminal" class="terminal-container">
                    <p class="terminal-line system">SISTEMA INICIADO...</p>
                    <p class="terminal-line system">ESPERANDO ACCIÓN...</p>
                </div>
                <div id="txResult" class="tx-result hidden">
                    <h3>Confirmación On-Chain</h3>
                    <p id="txHash" class="tx-hash-display">---</p>
                    <a id="btnStellarLink" href="#" target="_blank" class="btn-link">Ver en Stellar Explorer</a>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
